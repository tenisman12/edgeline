name: corrida intradia (cuotas, resultados y calificacion)

# GitHub retrasa o se salta corridas programadas cuando tiene carga (el 2-oct hubo retrasos de 4 a 6 h y
# corridas que nunca salieron). Por eso esta corrida va CADA HORA y cada paso decide por si mismo:
#   - The Odds API solo se pide si la ultima foto tiene 3 h o mas (--min-horas 3): maximo ~8 fotos al dia,
#     el mismo gasto que antes, aunque se pierdan corridas.
#   - Resultados recientes (actualizar_todo.py) en cada corrida: los juegos de Asia se califican en cuanto
#     terminan, sin esperar a la corrida grande.
#   - plataforma.py nunca registra picks de partidos ya empezados (bloque 1), asi que un retraso ya no ensucia
#     el track record.
on:
  schedule:
    - cron: "23 0-4,6-12,14-18,20-23 * * *"   # cada hora, menos las horas de actualizar.yml (05, 13, 19 UTC)
  workflow_dispatch:

concurrency:
  group: edgeline-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cuotas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EDGELINE_BASE: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Datos historicos (rama datos)
        run: |
          git fetch --depth=1 origin datos
          git archive FETCH_HEAD datos | tar -x -C .

      - name: Resultados recientes (solo lo nuevo)
        continue-on-error: true
        timeout-minutes: 20
        run: python actualizar_todo.py

      - name: Bajar partidos por jugar y cuotas (ESPN)
        continue-on-error: true
        run: python colectores/recolectar_proximos.py --dias 3 --sin-contexto

      - name: Guardar foto de cuotas (ESPN)
        continue-on-error: true
        run: python colectores/snapshot_cuotas.py

      # The Odds API, plan de pago (20,000 creditos/mes): 6 creditos por deporte (3 mercados x 2 regiones).
      # Presupuesto 72 por foto; con --min-horas 3 salen como maximo 8 fotos al dia = 576/dia = ~17,300/mes.
      - name: Cuotas de todas las casas (The Odds API, si la foto tiene 3 h o mas)
        env:
          EDGELINE_ODDS_KEY: ${{ secrets.ODDS_KEY }}
          EDGELINE_ODDS_PRESUPUESTO: "72"
          EDGELINE_ODDS_REGIONES: us,eu
        continue-on-error: true
        run: python colectores/recolectar_cuotas.py --solo-compacto --min-horas 3

      - name: Lectura sharp vs publico (casas sharp contra casas del publico)
        continue-on-error: true
        run: python utilidades/mercado_libros.py --actualizar --ver --horas 48 > /tmp/mercado.txt; head -5 /tmp/mercado.txt

      - name: Porteros titulares de NHL (Daily Faceoff) y xG por equipo (MoneyPuck)
        continue-on-error: true
        run: |
          python colectores/recolectar_porteros.py || true
          python colectores/recolectar_xg_nhl.py || true

      - name: Re-predecir con cuotas y contexto frescos
        continue-on-error: true
        timeout-minutes: 20
        run: python plataforma.py --dias 3

      - name: Sistema estimado de beisbol (ELO + diferencial + abridor contra Pinnacle)
        continue-on-error: true
        run: python utilidades/decidir.py --dias 2

      - name: Publico (boletos y dinero de Action Network, notas de Google News)
        continue-on-error: true
        timeout-minutes: 15
        run: python colectores/recolectar_publico.py --dias 2

      - name: Medir las reglas de ir contra el publico (se acumula, no decide)
        continue-on-error: true
        run: python utilidades/validar_contrapublico.py

      - name: Medir el movimiento de linea contra el resultado (se acumula, no decide)
        continue-on-error: true
        run: python utilidades/validar_movimiento.py

      - name: Picks del dia (decision por partido y lista oficial, tope 4)
        continue-on-error: true
        run: python utilidades/picks_del_dia.py --dias 2

      - name: Medir los angulos situacionales en vivo (se acumula, no decide)
        continue-on-error: true
        run: python utilidades/medir_angulos_vivo.py

      - name: Resumen por liga (archivos chicos legibles por enlace)
        continue-on-error: true
        run: python utilidades/resumen_ligas.py --dias 2

      - name: Limpiar historial
        continue-on-error: true
        run: python utilidades/limpiar_historial.py --aplicar

      - name: Calificar picks
        continue-on-error: true
        run: python utilidades/calificar_picks.py | head -20

      - name: CLV contra el cierre de Pinnacle (picks y modelo)
        continue-on-error: true
        run: python utilidades/clv.py

      - name: Subir a main
        run: bash utilidades/subir_a_main.sh "cuotas" "salida/odds_snapshots_*.csv salida/cuotas_casas.json salida/cuotas_sharp_*.csv salida/odds_creditos.json salida/mercado_libros.json salida/mercado_publico.json salida/proximos.json salida/historial_picks.csv salida/historial_calificado.csv salida/track_record.json salida/historial_predicciones.csv salida/historial_predicciones_calificado.csv salida/decidir.json salida/historial_decidir.csv salida/historial_decidir_calificado.csv salida/picks_del_dia.json salida/historial_picks_dia.csv salida/historial_picks_dia_calificado.csv salida/publico.json salida/publico_*.csv salida/historial_breaks_calificado.csv salida/resumen/*.json salida/resumen/LEEME.md salida/totales_vs_linea.json salida/cobertura_datos.json salida/clv.json salida/clv_detalle.csv salida/historial_angulos.csv salida/angulos_vivo.json"

      - name: Publicar datos en la rama datos (una sola version, sin historial)
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          rsync -a --exclude jugadores --exclude _respaldo datos /tmp/pub/
          cd /tmp/pub
          git init -q -b datos
          git config user.name "edgeline-bot"
          git config user.email "edgeline-bot@users.noreply.github.com"
          git add -A
          git commit -qm "datos $(date -u +'%Y-%m-%d %H:%M')Z"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

      - name: Revision de integridad (va al final, con los datos ya publicados, para que la corrida se ponga en rojo sin bloquear la salida)
        run: python utilidades/revision.py
