name: sonda de fuentes externas
# Manual: prueba si Actions alcanza fuentes nuevas (Torvik, predictor de ESPN) y muestra el inicio de cada respuesta.
# No guarda nada en el repo.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probar URLs
        run: |
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          probar () {
            echo "================ $1"
            curl -sS -L -A "$ua" --max-time 40 -o /tmp/r -w "HTTP %{http_code} | %{size_download} bytes | %{content_type}\n" "$1" || true
            (file /tmp/r; head -c 900 /tmp/r | tr -d '\000'; echo) 2>/dev/null || true
            resumen=$( (curl -sS -L -A "$ua" --max-time 40 -o /tmp/r2 -w "HTTP %{http_code} %{size_download}B" "$1"; echo " | "; (zcat -f /tmp/r2 2>/dev/null || cat /tmp/r2) | head -c 600 | tr -d '\000' | tr '\n\r' '  ') 2>&1 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::notice title=$2::$resumen"
          }
          probar "http://www.tennis-data.co.uk/2024/2024.xlsx" "t1"
          probar "http://www.tennis-data.co.uk/2024w/2024.xlsx" "t2"
          probar "http://www.tennis-data.co.uk/alldata.php" "t3"
          probar "https://www.sportsbookreviewsonline.com/scoresoddsarchives/nhl/nhl%20odds%202021-22.xlsx" "s1"
          probar "https://www.sportsbookreviewsonline.com/scoresoddsarchives/mlb/mlb%20odds%202021.xlsx" "s2"
          probar "https://www.sportsbookreviewsonline.com/scoresoddsarchives/nba/nba%20odds%202021-22.xlsx" "s3"
          probar "https://www.sportsbookreviewsonline.com/scoresoddsarchives/nhl-odds-2021-22" "s4"
          python3 - <<'PY'
          import json, urllib.request
          ua = {"User-Agent": "Mozilla/5.0"}
          for tag, url in (("e1", "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401859967"),
                           ("e2", "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/summary?event=401856600"),
                           ("e3", "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/401859967/competitions/401859967/odds"),
                           ("e4", "https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl/events/401802255/competitions/401802255/odds"),
                           ("e5", "https://sports.core.api.espn.com/v2/sports/baseball/leagues/mlb/events/401696221/competitions/401696221/odds")):
              try:
                  d = json.loads(urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=40).read())
                  pc = d.get("pickcenter") if "pickcenter" in d else d.get("items")
                  txt = json.dumps(pc)[:700] if pc is not None else ("claves: " + ",".join(list(d)[:20]))
              except Exception as e:
                  txt = "error %s" % e
              print("::notice title=%s::%s" % (tag, txt.replace("%", "%25").replace("\n", " ")))
          PY
          probar "https://barttorvik.com/2025_super_sked.csv" "p1"
          probar "https://barttorvik.com/trank.php?year=2025&csv=1" "p2"
          probar "https://barttorvik.com/2025_team_results.csv" "p3"
          probar "https://barttorvik.com/timemachine/team_results/20250115_team_results.json.gz" "p4"
          probar "https://barttorvik.com/getgamestats.php?year=2025&csv=1" "p5"
          probar "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=401859967" "p6"
          probar "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/events/401859967/competitions/401859967/predictor" "p7"
          probar "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/401547562/competitions/401547562/predictor" "p8"
          probar "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/401872980/competitions/401872980/predictor" "p9"
          probar "https://sports.core.api.espn.com/v2/sports/basketball/leagues/mens-college-basketball/events/401856600/competitions/401856600/predictor" "p10"
          probar "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/summary?event=401856600" "p11"
          probar "https://moneypuck.com/moneypuck/gameData/20252026/2025020001.csv" "p12"
