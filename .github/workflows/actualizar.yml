name: actualizar datos y predicciones

on:
  schedule:
    - cron: "17 11 * * *"        # todos los dias 11:17 UTC = 05:17 CDMX
  workflow_dispatch:

concurrency:
  group: edgeline-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EDGELINE_BASE: ${{ github.workspace }}
      EDGELINE_ODDS_KEY: ${{ secrets.ODDS_KEY }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos (rama datos)
        run: |
          if ! git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            echo "::error::No existe la rama 'datos'. Hay que subirla la primera vez desde tu computadora."
            exit 1
          fi
          git fetch --depth=1 origin datos
          git archive FETCH_HEAD datos | tar -x -C .
          ls datos | head -30

      - name: Sembrar jugadores recientes
        run: python utilidades/jugadores_recientes.py sembrar

      - name: Actualizar datos (solo lo nuevo)
        continue-on-error: true
        run: python actualizar_todo.py

      - name: Actualizar jugadores recientes (solo lo nuevo)
        continue-on-error: true
        timeout-minutes: 120
        run: python utilidades/jugadores_recientes.py diario

      - name: Diagnostico ESPN (que contesta al servidor)
        continue-on-error: true
        run: |
          for h in site.api.espn.com site.web.api.espn.com; do
            echo "== $h"
            curl -sS -o /tmp/espn.txt -w "HTTP %{http_code} tipo %{content_type} bytes %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" "https://$h/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261001" || true
            head -c 200 /tmp/espn.txt; echo
          done
      - name: Validar mercados de futbol (walk-forward)
        continue-on-error: true
        run: python utilidades/validar_futbol_mercados.py | tail -5

      - name: Validar mercados de los demas deportes (lunes, o si falta el archivo)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f salida/validacion_mercados.json ]; then
            python utilidades/validar_mercados.py --deporte hockey,nfl,nba,tenis | tail -5
          else
            echo "No es lunes y ya existe validacion_mercados.json: se reutiliza."
          fi

      - name: Predecir proximos dias
        run: python plataforma.py --dias 3

      - name: Calificar picks contra resultados reales
        continue-on-error: true
        run: python utilidades/calificar_picks.py

      - name: Guardar predicciones en main
        run: bash utilidades/subir_a_main.sh "predicciones" salida/proximos.json salida/historial_picks.csv salida/validacion_futbol.json salida/validacion_mercados.json salida/historial_calificado.csv salida/track_record.json

      - name: Publicar datos en la rama datos (una sola version, sin historial)
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          rsync -a --exclude jugadores --exclude _respaldo datos /tmp/pub/
          cd /tmp/pub
          git init -q -b datos
          git config user.name "edgeline-bot"
          git config user.email "edgeline-bot@users.noreply.github.com"
          git add -A
          git commit -qm "datos $(date -u +'%Y-%m-%d %H:%M')Z"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
