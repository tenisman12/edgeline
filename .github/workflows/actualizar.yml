name: actualizar datos y predicciones

on:
  schedule:
    - cron: "37 5,13,19 * * *"   # tres veces al dia (lo pesado: jugadores, validacion, Picks IA):
                                 #   05:37 UTC = 23:37 CDMX (cierre del dia en America)
                                 #   13:37 UTC = 07:37 CDMX (ya terminaron NPB y KBO de la noche de Asia)
                                 #   19:37 UTC = 13:37 CDMX (lineas y picks de la tarde)
                                 # Resultados, cuotas y calificacion tambien corren cada hora en cuotas.yml.
  workflow_dispatch:

concurrency:
  group: edgeline-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EDGELINE_BASE: ${{ github.workspace }}
      EDGELINE_ODDS_KEY: ${{ secrets.ODDS_KEY }}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos (rama datos)
        run: |
          if ! git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            echo "::error::No existe la rama 'datos'. Hay que subirla la primera vez desde tu computadora."
            exit 1
          fi
          git fetch --depth=1 origin datos
          git archive FETCH_HEAD datos | tar -x -C .
          ls datos | head -30

      - name: Jugadores (sembrar desde datos/jugadores_recientes y bajar solo lo nuevo)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python utilidades/jugadores_recientes.py sembrar
          python utilidades/jugadores_recientes.py diario --dias-max 14
          python utilidades/jugadores_recientes.py estado | tail -25

      - name: Actualizar datos (solo lo nuevo)
        continue-on-error: true
        run: python actualizar_todo.py

      - name: Diagnostico ESPN (que contesta al servidor)
        continue-on-error: true
        run: |
          for h in site.api.espn.com site.web.api.espn.com; do
            echo "== $h"
            curl -sS -o /tmp/espn.txt -w "HTTP %{http_code} tipo %{content_type} bytes %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" "https://$h/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261001" || true
            head -c 200 /tmp/espn.txt; echo
          done
      - name: Validar mercados de futbol (walk-forward)
        continue-on-error: true
        run: python utilidades/validar_futbol_mercados.py | tail -5

      - name: Validar mercados de los demas deportes (lunes, o si falta el archivo)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "11" ]; } || [ ! -f salida/validacion_mercados.json ] || ! grep -q beisbol_mlb salida/validacion_mercados.json; then
            python utilidades/validar_mercados.py --deporte hockey,nfl,nba,tenis,beisbol | tail -5
          else
            echo "No es lunes y ya existe validacion_mercados.json: se reutiliza."
          fi

      - name: Cuotas de todas las casas (The Odds API, si la foto tiene 3 h o mas)
        env:
          EDGELINE_ODDS_KEY: ${{ secrets.ODDS_KEY }}
          EDGELINE_ODDS_PRESUPUESTO: "72"       # plan de pago (20,000/mes): 16 deportes por foto, us+eu
          EDGELINE_ODDS_REGIONES: us,eu
        continue-on-error: true
        run: python colectores/recolectar_cuotas.py --solo-compacto --min-horas 3   # no gasta si la foto tiene menos de 3 h

      - name: Lectura sharp vs publico (casas sharp contra casas del publico)
        continue-on-error: true
        run: python utilidades/mercado_libros.py --actualizar --ver --horas 48 > /tmp/mercado.txt; head -5 /tmp/mercado.txt

      - name: Predecir proximos dias
        run: python plataforma.py --dias 7

      - name: Sistema estimado de beisbol (ELO + diferencial + abridor contra Pinnacle)
        continue-on-error: true
        run: python utilidades/decidir.py --dias 2

      - name: Publico (boletos y dinero de Action Network, notas de Google News)
        continue-on-error: true
        timeout-minutes: 15
        run: python colectores/recolectar_publico.py --dias 2

      - name: Picks del dia (decision por partido y lista oficial, tope 4)
        continue-on-error: true
        run: python utilidades/picks_del_dia.py --dias 2

      - name: Picks IA (lectura razonada; se salta si no hay ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python utilidades/picks_ia.py --dias 2; else echo "Sin ANTHROPIC_API_KEY: se omite Picks IA"; fi

      - name: Limpiar historial (pretemporada y formato viejo)
        continue-on-error: true
        run: python utilidades/limpiar_historial.py --aplicar

      - name: Calificar picks contra resultados reales
        continue-on-error: true
        run: python utilidades/calificar_picks.py

      - name: Guardar predicciones en main
        run: bash utilidades/subir_a_main.sh "predicciones" salida/proximos.json salida/historial_picks.csv salida/validacion_futbol.json salida/validacion_mercados.json salida/historial_calificado.csv salida/track_record.json salida/historial_predicciones.csv salida/historial_predicciones_calificado.csv salida/cuotas_casas.json salida/cuotas_sharp_*.csv salida/odds_creditos.json salida/mercado_libros.json salida/mercado_publico.json salida/picks_ia.json salida/historial_ia.csv salida/historial_ia_calificado.csv salida/decidir.json salida/historial_decidir.csv salida/historial_decidir_calificado.csv salida/picks_del_dia.json salida/historial_picks_dia.csv salida/historial_picks_dia_calificado.csv salida/publico.json salida/publico_*.csv

      - name: Publicar datos en la rama datos (una sola version, sin historial)
        if: always()          # los datos bajados se guardan aunque falle la prediccion (no se pierde el relleno de jugadores)
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          rsync -a --exclude jugadores --exclude _respaldo datos /tmp/pub/   # jugadores_recientes SI se publica
          cd /tmp/pub
          git init -q -b datos
          git config user.name "edgeline-bot"
          git config user.email "edgeline-bot@users.noreply.github.com"
          git add -A
          git commit -qm "datos $(date -u +'%Y-%m-%d %H:%M')Z"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
